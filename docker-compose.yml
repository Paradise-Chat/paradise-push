services:
  paradise-push:
    image: ghcr.io/paradise-chat/paradise-push:latest
    container_name: paradise-push
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./configs:/app/configs:ro
      - ./routes:/app/routes:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3